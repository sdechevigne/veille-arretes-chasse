name: Veille arrêtés de chasse

# Collecte et lecture mécanique + images des pages scannées, ici ; la lecture Claude tourne la nuit sur la machine Manta
# (scripts/lecture-nocturne.sh, opencode local), pas sur GitHub.
# Rythme : quotidien d'avril à août, hebdomadaire (lundi) le reste de l'année — décidé dans le job.
# Les sites .gouv.fr n'acceptent que des adresses françaises : le job ouvre une connexion hide.me (serveur gratuit free-fr) avant la collecte
# et la referme à la fin (recette : meschasses/docs/superpowers/specs/2026-10-14-veille-arretes-chasse-acces-prefectures.md §2).
# Le cron est suspendu tant que le secret HIDEME_USER est absent ; le lancement manuel reste possible (option sans_proxy :
# pas de connexion hide.me, sources .gouv.fr écartées). VEILLE_PROXY_URL reste lu en secours (lancement manuel sans hide.me).
# Le lundi (planifié), le job « bilan » commite etat/dernier-bilan.json : un commit réel par semaine garde le cron actif
# (GitHub suspend le planning d'un dépôt public après 60 jours sans commit).
on:
  schedule:
    - cron: '20 5 * * *'   # 05:20 UTC chaque jour ; le job sort tout de suite hors campagne sauf le lundi
  workflow_dispatch:
    inputs:
      departements:
        description: 'Codes séparés par des virgules (vide = tous)'
        required: false
        default: ''
      sans_proxy:
        description: 'Pas de connexion hide.me ni de proxy : sources .gouv.fr écartées (fédérations seulement)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veille-arretes
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      # Calculée par la toute première étape (toujours exécutée, même si go=false) : le bilan du lundi n'en dépend pas.
      lundi: ${{ steps.rythme.outputs.lundi }}
    defaults:
      run:
        shell: bash   # -eo pipefail : un échec avant `tee` fait échouer l'étape
    steps:
      - name: Faut-il tourner aujourd'hui ?
        id: rythme
        env:
          EVENEMENT: ${{ github.event_name }}
          DEPARTEMENTS: ${{ github.event.inputs.departements }}
          HIDEME_USER: ${{ secrets.HIDEME_USER }}
        run: |
          mois=$(date -u +%m); jour=$(date -u +%u)
          # Codes de départements : validés une seule fois ici, relus par « Collecte » (sortie `departements`).
          if [ -n "$DEPARTEMENTS" ]; then
            [[ "$DEPARTEMENTS" =~ ^[0-9A-Ba-b]{2}(,[0-9A-Ba-b]{2})*$ ]] || { echo "departements invalides : $DEPARTEMENTS" >&2; exit 2; }
          fi
          echo "departements=$DEPARTEMENTS" >> "$GITHUB_OUTPUT"
          # `secrets` n'est pas utilisable dans `if:` : la présence du compte hide.me passe par une sortie d'étape.
          if [ -n "$HIDEME_USER" ]; then echo "france=true" >> "$GITHUB_OUTPUT"; else echo "france=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$jour" = "1" ]; then echo "lundi=true" >> "$GITHUB_OUTPUT"; else echo "lundi=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$EVENEMENT" = "schedule" ] && [ -z "$HIDEME_USER" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "compte hide.me absent : collecte planifiée suspendue (les sources .gouv.fr seraient toutes en échec)"
          elif [ "$EVENEMENT" = "workflow_dispatch" ] || { [ "$mois" -ge 4 ] && [ "$mois" -le 8 ]; } || [ "$jour" = "1" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Hors campagne et pas lundi : rien à faire."
          fi
      - uses: actions/checkout@v4
        if: steps.rythme.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.rythme.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Outils PDF / OCR
        if: steps.rythme.outputs.go == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Dépendances
        if: steps.rythme.outputs.go == 'true'
        run: npm ci
      - name: Client hide.me
        if: steps.rythme.outputs.go == 'true' && steps.rythme.outputs.france == 'true' && github.event.inputs.sans_proxy != 'true'
        run: |
          curl -sSL -o h.tgz https://github.com/eventure/hide.client.linux/releases/download/v0.9.14/hide.me-linux-amd64-0.9.14.tar.gz
          # Intégrité : empreinte épinglée de la v0.9.14 (à recalculer à la main en cas de changement de version).
          echo "3e9d6842a95a2c91c6e91bdf86389cd74390dda491f206b5b07c402254a56d8f  h.tgz" | sha256sum -c -
          mkdir hide && tar -xzf h.tgz -C hide
      - name: Jeton hide.me
        if: steps.rythme.outputs.go == 'true' && steps.rythme.outputs.france == 'true' && github.event.inputs.sans_proxy != 'true'
        working-directory: hide
        env:
          HU: ${{ secrets.HIDEME_USER }}
          HP: ${{ secrets.HIDEME_PASSWORD }}
        run: |
          # Identifiants par fichier de configuration (jamais `-P` en argument : visible dans la liste des processus) ; lus par jq dans l'environnement, pas en argument.
          umask 077
          ./hide.me jsonconf > base.json 2>/dev/null || true
          jq '.Rest.Username=env.HU | .Rest.Password=env.HP' base.json > conf.json
          # Le client exige un terminal même quand les identifiants sont dans la configuration : pseudo-terminal par `script`.
          # `timeout 90` : sans lui, la demande de jeton peut pendre sans fin.
          sudo timeout 90 script -qec "./hide.me -c conf.json token free-fr.hideservers.net" /dev/null < /dev/null
          sudo test -s accessToken.txt
      - name: Connexion France
        id: vpn
        if: steps.rythme.outputs.go == 'true' && steps.rythme.outputs.france == 'true' && github.event.inputs.sans_proxy != 'true'
        working-directory: hide
        run: |
          sudo nohup ./hide.me -c conf.json connect free-fr.hideservers.net > ../hideme.log 2>&1 &
          for i in $(seq 1 30); do [ "$(curl -s -m 8 https://ipinfo.io/country)" = FR ] && break; sleep 3; done
          # Pas de sortie française : échec de l'étape avec la fin du journal hide.me (filtré : jamais une ligne évoquant mot de passe ou jeton).
          [ "$(curl -s -m 8 https://ipinfo.io/country)" = FR ] || { tail -30 ../hideme.log | grep -viE 'password|token'; exit 1; }
          echo "sortie=true" >> "$GITHUB_OUTPUT"
      - name: Collecte
        if: steps.rythme.outputs.go == 'true'
        env:
          DEPARTEMENTS: ${{ steps.rythme.outputs.departements }}
          SANS_PROXY: ${{ github.event.inputs.sans_proxy }}
          SORTIE_FRANCE: ${{ steps.vpn.outputs.sortie }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          VEILLE_PROXY_URL: ${{ secrets.VEILLE_PROXY_URL }}
        run: |
          args=()
          [ -n "$DEPARTEMENTS" ] && args+=(--departements "$DEPARTEMENTS")
          [ "$SANS_PROXY" = "true" ] && args+=(--sans-proxy)
          # Posé seulement si « Connexion France » a vérifié une sortie FR : les sources .gouv.fr ne sont alors plus écartées.
          [ "$SORTIE_FRANCE" = "true" ] && args+=(--sortie-france)
          npm run veille -- collecter --budget-min 45 "${args[@]}" | tee collecte.json
      - name: Lecture mécanique
        if: steps.rythme.outputs.go == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          VEILLE_PROXY_URL: ${{ secrets.VEILLE_PROXY_URL }}
        run: npm run veille -- lire --limite 100 --budget-min 60 | tee lecture.json
      - name: Images des pages
        if: steps.rythme.outputs.go == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
        # `-s` : sans l'en-tête de npm, stdout ne porte que le JSON.
        run: npm run -s veille -- images-pages --limite 200 --budget-min 20 | tee images-pages.json
      - name: Santé des sources
        if: steps.rythme.outputs.go == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          VEILLE_PROXY_URL: ${{ secrets.VEILLE_PROXY_URL }}
        run: npm run veille -- sante | tee sante.json
      - name: Déconnexion
        if: always() && steps.rythme.outputs.go == 'true' && steps.rythme.outputs.france == 'true' && github.event.inputs.sans_proxy != 'true'
        run: |
          sudo pkill -INT -f 'hide.me .*connect' || true
          # L'arrêt est asynchrone : on attend la fin du client (15 s au plus) pour que le téléversement des artefacts parte sans le VPN.
          # `[h]ide.me` : le motif ne se reconnaît pas lui-même dans la ligne de commande de pgrep.
          for i in $(seq 1 15); do pgrep -f '[h]ide.me .*connect' > /dev/null || break; sleep 1; done
          pgrep -f '[h]ide.me .*connect' > /dev/null && echo "hide.me toujours actif après 15 s" || echo "hide.me arrêté"
          echo "pays après déconnexion : $(curl -s -m 8 https://ipinfo.io/country || true)"
          # Aucune trace des identifiants ni du jeton dans l'espace de travail (artefacts, étapes suivantes).
          sudo rm -f hide/conf.json hide/accessToken.txt hide/base.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.rythme.outputs.go == 'true'
        with:
          name: veille-arretes-${{ github.run_id }}
          path: |
            collecte.json
            lecture.json
            images-pages.json
            sante.json
          retention-days: 30

  # Bilan du lundi (planifié) : notification et fichier d'état commité. Seul job autorisé à écrire dans le dépôt.
  bilan:
    needs: veille
    # Ne lit que Supabase : indépendant de `go` (le cron reste « suspendu » côté collecte tant que le compte hide.me est absent,
    # mais le commit hebdomadaire doit quand même partir pour garder le planning actif).
    if: always() && github.event_name == 'schedule' && needs.veille.outputs.lundi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Bilan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          MANTA_WEBHOOK_URL: ${{ secrets.MANTA_WEBHOOK_URL }}
          MANTA_WEBHOOK_SECRET: ${{ secrets.MANTA_WEBHOOK_SECRET }}
        run: npm run -s veille -- bilan --notifier --etat etat/dernier-bilan.json
      - name: Commit du bilan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat/dernier-bilan.json
          if git diff --cached --quiet -- etat/dernier-bilan.json; then echo "bilan inchangé"; exit 0; fi
          git commit -m "chore: bilan hebdomadaire" -- etat/dernier-bilan.json
          # main a pu avancer pendant le job veille (jusqu'à 3 h) : on se replace dessus avant de pousser.
          git pull --rebase origin main
          git push origin HEAD:main
