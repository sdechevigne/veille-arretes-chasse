name: Veille arrêtés de chasse

# Pipeline complet : collecte, lecture mécanique, lecture Claude (si CLAUDE_CODE_OAUTH_TOKEN est posé), notification Manta.
# Rythme : quotidien d'avril à août, hebdomadaire (lundi) le reste de l'année — décidé dans le job.
# Le cron est suspendu tant que le secret VEILLE_PROXY_URL est absent ; le lancement manuel reste possible.
# Le lundi (planifié), le job « bilan » commite etat/dernier-bilan.json : un commit réel par semaine garde le cron actif
# (GitHub suspend le planning d'un dépôt public après 60 jours sans commit).
on:
  schedule:
    - cron: '20 5 * * *'   # 05:20 UTC chaque jour ; le job sort tout de suite hors campagne sauf le lundi
  workflow_dispatch:
    inputs:
      departements:
        description: 'Codes séparés par des virgules (vide = tous)'
        required: false
        default: ''
      sans_proxy:
        description: 'Ignorer le proxy et écarter les sources .gouv.fr (fédérations seulement)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veille-arretes
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      # Calculée par la toute première étape (toujours exécutée, même si go=false) : le bilan du lundi n'en dépend pas.
      lundi: ${{ steps.rythme.outputs.lundi }}
    defaults:
      run:
        shell: bash   # -eo pipefail : un échec avant `tee` fait échouer l'étape
    steps:
      - name: Faut-il tourner aujourd'hui ?
        id: rythme
        env:
          EVENEMENT: ${{ github.event_name }}
          DEPARTEMENTS: ${{ github.event.inputs.departements }}
          VEILLE_PROXY_URL: ${{ secrets.VEILLE_PROXY_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mois=$(date -u +%m); jour=$(date -u +%u)
          # Codes de départements : validés une seule fois ici, relus par « Collecte » et « Lecture Claude » (sortie `departements`).
          if [ -n "$DEPARTEMENTS" ]; then
            [[ "$DEPARTEMENTS" =~ ^[0-9A-Ba-b]{2}(,[0-9A-Ba-b]{2})*$ ]] || { echo "departements invalides : $DEPARTEMENTS" >&2; exit 2; }
          fi
          echo "departements=$DEPARTEMENTS" >> "$GITHUB_OUTPUT"
          # `secrets` n'est pas utilisable dans `if:` : la présence du jeton Claude passe par une sortie d'étape.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "claude=true" >> "$GITHUB_OUTPUT"; else echo "claude=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$jour" = "1" ]; then echo "lundi=true" >> "$GITHUB_OUTPUT"; else echo "lundi=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$EVENEMENT" = "schedule" ] && [ -z "$VEILLE_PROXY_URL" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "proxy absent : collecte planifiée suspendue (les sources .gouv.fr seraient toutes en échec)"
          elif [ "$EVENEMENT" = "workflow_dispatch" ] || { [ "$mois" -ge 4 ] && [ "$mois" -le 8 ]; } || [ "$jour" = "1" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Hors campagne et pas lundi : rien à faire."
          fi
      - uses: actions/checkout@v4
        if: steps.rythme.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.rythme.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Outils PDF / OCR
        if: steps.rythme.outputs.go == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Dépendances
        if: steps.rythme.outputs.go == 'true'
        run: npm ci
      - name: Collecte
        if: steps.rythme.outputs.go == 'true'
        env:
          DEPARTEMENTS: ${{ steps.rythme.outputs.departements }}
          SANS_PROXY: ${{ github.event.inputs.sans_proxy }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          VEILLE_PROXY_URL: ${{ secrets.VEILLE_PROXY_URL }}
        run: |
          args=()
          [ -n "$DEPARTEMENTS" ] && args+=(--departements "$DEPARTEMENTS")
          [ "$SANS_PROXY" = "true" ] && args+=(--sans-proxy)
          npm run veille -- collecter --budget-min 45 "${args[@]}" | tee collecte.json
      - name: Lecture mécanique
        if: steps.rythme.outputs.go == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          VEILLE_PROXY_URL: ${{ secrets.VEILLE_PROXY_URL }}
        run: npm run veille -- lire --limite 100 --budget-min 60 | tee lecture.json
      - name: Claude Code CLI
        if: steps.rythme.outputs.go == 'true' && steps.rythme.outputs.claude == 'true'
        run: npm i -g @anthropic-ai/claude-code@2.1.287
      - name: Lecture Claude
        if: steps.rythme.outputs.go == 'true' && steps.rythme.outputs.claude == 'true'
        env:
          DEPARTEMENTS: ${{ steps.rythme.outputs.departements }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
        run: |
          args=()
          [ -n "$DEPARTEMENTS" ] && args+=(--departements "$DEPARTEMENTS")
          # `-s` : sans l'en-tête de npm, stdout ne porte que le JSON (lu par l'étape Notification).
          npm run -s veille -- lire-claude --limite 40 --budget-min 50 "${args[@]}" | tee lecture-claude.json
      - name: Notification
        if: always() && steps.rythme.outputs.go == 'true' && steps.rythme.outputs.claude == 'true'
        continue-on-error: true   # une notification ratée ne doit jamais empêcher « Santé des sources »
        env:
          MANTA_WEBHOOK_URL: ${{ secrets.MANTA_WEBHOOK_URL }}
          MANTA_WEBHOOK_SECRET: ${{ secrets.MANTA_WEBHOOK_SECRET }}
        run: |
          if [ ! -s lecture-claude.json ]; then echo "pas de lecture-claude.json : aucune notification"; exit 0; fi
          # Fichier tronqué / invalide : lecture en échec → « non » (jamais d'échec d'étape). Sans lecture automatique =
          # documents mis en attente d'un opérateur, à signaler comme les propositions.
          a_notifier=$(node -e 'const s = JSON.parse(require("fs").readFileSync("lecture-claude.json", "utf8")); console.log(s.enAttente > 0 || s.sansLecture > 0 || s.arretQuota ? "oui" : "non")' 2>/dev/null || echo non)
          if [ "$a_notifier" = "oui" ]; then npm run -s veille -- notifier --fichier lecture-claude.json; else echo "rien à signaler"; fi
      - name: Santé des sources
        if: steps.rythme.outputs.go == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          VEILLE_PROXY_URL: ${{ secrets.VEILLE_PROXY_URL }}
        run: npm run veille -- sante | tee sante.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.rythme.outputs.go == 'true'
        with:
          name: veille-arretes-${{ github.run_id }}
          path: |
            collecte.json
            lecture.json
            lecture-claude.json
            sante.json
          retention-days: 30

  # Bilan du lundi (planifié) : notification et fichier d'état commité. Seul job autorisé à écrire dans le dépôt.
  bilan:
    needs: veille
    # Ne lit que Supabase : indépendant de `go` (le cron reste « suspendu » côté collecte tant que le proxy est absent,
    # mais le commit hebdomadaire doit quand même partir pour garder le planning actif).
    if: always() && github.event_name == 'schedule' && needs.veille.outputs.lundi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Bilan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_VEILLE_BUCKET: ${{ secrets.R2_VEILLE_BUCKET }}
          MANTA_WEBHOOK_URL: ${{ secrets.MANTA_WEBHOOK_URL }}
          MANTA_WEBHOOK_SECRET: ${{ secrets.MANTA_WEBHOOK_SECRET }}
        run: npm run -s veille -- bilan --notifier --etat etat/dernier-bilan.json
      - name: Commit du bilan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat/dernier-bilan.json
          if git diff --cached --quiet -- etat/dernier-bilan.json; then echo "bilan inchangé"; exit 0; fi
          git commit -m "chore: bilan hebdomadaire" -- etat/dernier-bilan.json
          # main a pu avancer pendant le job veille (jusqu'à 3 h) : on se replace dessus avant de pousser.
          git pull --rebase origin main
          git push origin HEAD:main
